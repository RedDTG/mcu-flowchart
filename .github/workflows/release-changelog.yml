name: Build release changelog from main PRs

on:
  release:
    types: [published, edited]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Replace release notes with PRs merged into main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release = context.payload.release;

            const categories = [
              { title: 'Breaking Changes', labels: ['breaking'] },
              { title: 'Major features', labels: ['major'] },
              { title: 'Minor features', labels: ['feature'] },
              { title: 'Bug Fixes', labels: ['bug'] },
              { title: 'Documentation', labels: ['docs'] },
              { title: 'Media content', labels: ['content'] },
              { title: 'Other Changes', labels: ['chore', 'dependencies'] },
            ];

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const currentPublishedAt = Date.parse(release.published_at || release.created_at);
            const previousRelease = releases
              .filter((candidate) => !candidate.draft)
              .filter((candidate) => candidate.id !== release.id)
              .filter((candidate) => Date.parse(candidate.published_at || candidate.created_at) < currentPublishedAt)
              .sort((left, right) => Date.parse(right.published_at || right.created_at) - Date.parse(left.published_at || left.created_at))[0];

            if (!previousRelease) {
              core.notice('No previous release found; keeping generated release notes unchanged.');
              return;
            }

            const commits = [];
            for (let page = 1; page < 100; page += 1) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousRelease.tag_name}...${release.tag_name}`,
                per_page: 100,
                page,
              });

              commits.push(...comparison.data.commits);

              if (comparison.data.commits.length < 100) {
                break;
              }
            }

            const integrationBranches = new Set(['main', 'stable']);
            const pullRequestsByNumber = new Map();
            const commitsWithoutPullRequest = [];
            // Keyed by commit author login rather than PR author, so a contribution still gets
            // credited even when its PR was bypassed (e.g. closed unmerged, then folded into
            // someone else's PR) — the commit author is what matters for "first contribution".
            const contributionReferenceByLogin = new Map();

            for (const commit of commits) {
              const pullRequests = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner,
                repo,
                commit_sha: commit.sha,
                per_page: 100,
              });

              let hasEligiblePullRequest = false;

              for (const pullRequest of pullRequests) {
                const labels = pullRequest.labels.map((label) => label.name);
                // Exclude only the main<->stable sync/promotion merges, not every PR based on either branch.
                const isSyncPullRequest = integrationBranches.has(pullRequest.head.ref) && integrationBranches.has(pullRequest.base.ref);
                const isExcluded = pullRequest.user?.login === 'dependabot' || labels.includes('skip-changelog');

                if (pullRequest.merged_at && !isSyncPullRequest && !isExcluded) {
                  pullRequestsByNumber.set(pullRequest.number, pullRequest);
                  hasEligiblePullRequest = true;
                }
              }

              if (!hasEligiblePullRequest && pullRequests.length === 0 && commit.parents.length < 2) {
                // No PR at all (e.g. pushed/merged directly with git) — keep the commit so it isn't silently dropped.
                commitsWithoutPullRequest.push(commit);
              }

              const authorLogin = commit.author?.login;
              if (authorLogin && !contributionReferenceByLogin.has(authorLogin)) {
                const ownPullRequest = pullRequests.find((pullRequest) => pullRequest.user?.login === authorLogin);
                contributionReferenceByLogin.set(authorLogin, ownPullRequest
                  ? { url: ownPullRequest.html_url, label: `#${ownPullRequest.number}` }
                  : { url: commit.html_url, label: commit.sha.slice(0, 7) });
              }
            }

            const pullRequests = [...pullRequestsByNumber.values()]
              .sort((left, right) => Date.parse(left.merged_at) - Date.parse(right.merged_at));

            if (pullRequests.length === 0 && commitsWithoutPullRequest.length === 0) {
              core.notice('No merged PRs or direct commits found in this release range; keeping generated release notes unchanged.');
              return;
            }

            const previousReleaseDate = Date.parse(previousRelease.published_at || previousRelease.created_at);
            const newContributors = [];

            for (const [login, reference] of contributionReferenceByLogin) {
              let hadEarlierContribution = true;

              try {
                const { data: searchResult } = await github.rest.search.commits({
                  q: `repo:${owner}/${repo} author:${login}`,
                  sort: 'author-date',
                  order: 'asc',
                  per_page: 1,
                });
                const earliestCommit = searchResult.items[0];
                hadEarlierContribution = Boolean(earliestCommit) && Date.parse(earliestCommit.commit.author.date) < previousReleaseDate;
              } catch (error) {
                // Fail safe: if we can't determine history, don't falsely credit someone as new.
                core.warning(`Could not determine contribution history for @${login}: ${error.message}`);
              }

              if (!hadEarlierContribution) {
                newContributors.push({ login, ...reference });
              }
            }

            const fallbackCategory = categories[categories.length - 1];
            const lines = [
              `## What's Changed`,
              '',
              `Changes included between \`${previousRelease.tag_name}\` and \`${release.tag_name}\`.`,
              '',
            ];

            for (const category of categories) {
              const matchingPullRequests = pullRequests.filter((pullRequest) => {
                const labels = pullRequest.labels.map((label) => label.name);
                const matchedCategory = categories.find((candidate) => candidate.labels.some((label) => labels.includes(label))) || fallbackCategory;
                return matchedCategory.title === category.title;
              });

              const isFallbackCategory = category.title === fallbackCategory.title;
              if (matchingPullRequests.length === 0 && !(isFallbackCategory && commitsWithoutPullRequest.length > 0)) {
                continue;
              }

              lines.push(`### ${category.title}`, '');
              for (const pullRequest of matchingPullRequests) {
                lines.push(`- ${pullRequest.title} by @${pullRequest.user.login} in #${pullRequest.number}`);
              }
              if (isFallbackCategory) {
                for (const commit of commitsWithoutPullRequest) {
                  const firstLine = commit.commit.message.split('\n')[0];
                  const author = commit.author?.login ? `@${commit.author.login}` : commit.commit.author.name;
                  lines.push(`- ${firstLine} by ${author} (${commit.sha.slice(0, 7)})`);
                }
              }
              lines.push('');
            }

            if (newContributors.length > 0) {
              lines.push('## New Contributors', '');
              for (const contributor of newContributors) {
                lines.push(`- @${contributor.login} made their first contribution in ${contributor.url}`);
              }
              lines.push('');
            }

            lines.push(`**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previousRelease.tag_name}...${release.tag_name}`);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: lines.join('\n'),
            });
